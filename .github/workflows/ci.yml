name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend tests scripts
      - run: python -m pytest -q
      - name: Engine smoke run on labelled synthetic data (performance guard)
        run: |
          python -m backend.cli stress --months 1 --out data/stress/EURUSD_1m.csv
          timeout 300 python -m backend.cli backtest data/stress/EURUSD_1m.csv --symbol EURUSD --daily-contexts none --no-save --no-chart --out /tmp/smoke.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t fx-research-lab:ci .
