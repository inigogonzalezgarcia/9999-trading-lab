services:
  api:
    build: .
    ports: ["8000:8000"]
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
  frontend:
    image: node:20-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
