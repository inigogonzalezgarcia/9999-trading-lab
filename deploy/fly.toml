# Fly.io config: `fly launch --copy-config --no-deploy && fly volumes create fxlab_data --size 1 && fly deploy`
app = "fx-research-lab"
primary_region = "mad"

[build]
  dockerfile = "../Dockerfile"

[env]
  FXLAB_DB = "/data/fxlab.sqlite3"
  FXLAB_MAX_UPLOAD_MB = "100"
  FXLAB_JOB_WORKERS = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "fxlab_data"
  destination = "/data"

[checks.health]
  type = "http"
  port = 8000
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
